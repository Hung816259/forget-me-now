name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A8C363: ${{ secrets.A8C363 }}
          BE4E4C: ${{ secrets.BE4E4C }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('A8C363', '')
          tag_b = os.environ.get('BE4E4C', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- ca433933dbef1c796b1a32c59ba280cbebbf05af -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- 6cc19c1feb28a6729d6764ba0bc003 -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forget Me Now - fishy & Trí Dũng</title>
  <style>
    body {
      background: linear-gradient(135deg, #0f0f1e, #1a1a2e);
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .player {
      text-align: center;
      max-width: 420px;
      background: rgba(255,255,255,0.05);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .vinyl {
      width: 280px;
      height: 280px;
      margin: 0 auto 20px;
      background: url('https://i.imgur.com/8zKz8zK.png') center/cover; /* Vinyl record image */
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(0, 200, 255, 0.6),
                  inset 0 0 40px rgba(0,0,0,0.8);
      animation: spin 4s linear infinite paused;
      cursor: pointer;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .playing .vinyl {
      animation-play-state: running;
    }
    h1 {
      font-size: 1.6rem;
      margin: 10px 0 5px;
    }
    p {
      color: #aaa;
      margin-bottom: 20px;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
    }
    button {
      background: #00d4ff;
      color: #000;
      border: none;
      padding: 12px 28px;
      font-size: 1.1rem;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s;
    }
    button:hover {
      background: #fff;
      transform: scale(1.05);
    }
    .youtube {
      margin-top: 20px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="player" id="player">
    <div class="vinyl" id="disc"></div>
    <h1>Forget Me Now</h1>
    <p>fishy & Trí Dũng</p>
    
    <div class="controls">
      <button id="playBtn">▶ Play</button>
    </div>

    <div class="youtube" id="ytContainer" style="display: none;">
      <iframe width="100%" height="315" 
        src="https://www.youtube.com/embed/NngRD9ZDDDU?autoplay=1&enablejsapi=1" 
        title="Forget Me Now" frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen></iframe>
    </div>
  </div>

  <script>
    const player = document.getElementById('player');
    const disc = document.getElementById('disc');
    const playBtn = document.getElementById('playBtn');
    const ytContainer = document.getElementById('ytContainer');
    let isPlaying = false;

    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      
      if (isPlaying) {
        player.classList.add('playing');
        playBtn.innerHTML = '❚❚ Pause';
        ytContainer.style.display = 'block';
      } else {
        player.classList.remove('playing');
        playBtn.innerHTML = '▶ Play';
        // You can pause YouTube here if you want more advanced control
      }
    });

    // Optional: Click on disc also toggles play
    disc.addEventListener('click', () => playBtn.click());
  </script>
</body>
</html>

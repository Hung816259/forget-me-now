<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forget Me Now - fishy & Trí Dũng</title>
  <style>
    body {
      background: linear-gradient(135deg, #0f0f1e, #1a1a2e);
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .player {
      text-align: center;
      max-width: 440px;
      background: rgba(255,255,255,0.08);
      padding: 35px 25px;
      border-radius: 24px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
    }
    .vinyl {
      width: 300px;
      height: 300px;
      margin: 0 auto 25px;
      background: url('https://pngimg.com/uploads/vinyl/vinyl_PNG30.png') center/contain no-repeat;
      border-radius: 50%;
      box-shadow: 
        0 0 35px rgba(0, 212, 255, 0.5),
        inset 0 0 60px rgba(0,0,0,0.9),
        0 15px 30px rgba(0,0,0,0.6);
      animation: spin 3.5s linear infinite paused;
      cursor: pointer;
      transition: transform 0.3s;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .playing .vinyl {
      animation-play-state: running;
    }
    h1 {
      font-size: 1.8rem;
      margin: 8px 0 4px;
      letter-spacing: -0.5px;
    }
    p {
      color: #00d4ff;
      font-size: 1.1rem;
      margin-bottom: 25px;
    }
    .controls button {
      background: #00d4ff;
      color: #000;
      border: none;
      padding: 14px 36px;
      font-size: 1.2rem;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }
    .controls button:hover {
      background: #fff;
      transform: scale(1.08);
    }
    .youtube {
      margin-top: 25px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 212, 255, 0.3);
    }
  </style>
<!-- ca433933dbef1c796b1a32c59ba280cbebbf05af -->
<!-- 6cc19c1feb28a6729d6764ba0bc003 -->
</head>
<body>
  <div class="player" id="player">
    <div class="vinyl" id="disc"></div>
    
    <h1>Forget Me Now</h1>
    <p>fishy & Trí Dũng</p>
    
    <div class="controls">
      <button id="playBtn">▶ PLAY</button>
    </div>

    <div class="youtube" id="ytContainer" style="display: none;">
      <iframe width="100%" height="315" 
        src="https://www.youtube.com/embed/NngRD9ZDDDU?autoplay=1&enablejsapi=1&rel=0" 
        title="Forget Me Now - fishy & Trí Dũng" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen></iframe>
    </div>
  </div>

  <script>
    const player = document.getElementById('player');
    const disc = document.getElementById('disc');
    const playBtn = document.getElementById('playBtn');
    const ytContainer = document.getElementById('ytContainer');
    let isPlaying = false;

    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      
      if (isPlaying) {
        player.classList.add('playing');
        playBtn.innerHTML = '❚❚ PAUSE';
        ytContainer.style.display = 'block';
      } else {
        player.classList.remove('playing');
        playBtn.innerHTML = '▶ PLAY';
      }
    });

    // Click on disc also toggles play/pause
    disc.addEventListener('click', () => playBtn.click());
  </script>
</body>
</html>
